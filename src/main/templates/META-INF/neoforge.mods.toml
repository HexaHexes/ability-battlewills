# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

# Optional with the API-minimum range (issue #41): main imports core's
# provider/consumer contract, so the range enforces the gated-declare surface
# whenever core is present. Kept "optional" (not "required") because a
# mandatory dep breaks every dev/GameTest run that does not carry core as a
# mod - org precedent: hotbar and tensura-iss-integration do the same. The
# release train bumps core first (docs/release-plan.md).
[[dependencies.${mod_id}]]
modId = "ability_core"
type = "optional"
versionRange = "[1.0.0-alpha.37,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional Tensura: Reincarnated (issue #41): the resource pairs gate on
# ModList at declaration and auto-disable without it; the mod works fully on
# core's built-ins alone.
[[dependencies.${mod_id}]]
modId = "tensura"
type = "optional"
versionRange = "[2.0.1.3,)"
ordering = "AFTER"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
