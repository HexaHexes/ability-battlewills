plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    // Keep in sync with rootProject.name in settings.gradle and mod_id in
    // gradle.properties. The shipped jar is <archivesName>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests live in their own source set: they compile against main, and are
// deliberately NOT part of sourceSets.main - so none of it is packaged into the
// released jar. Declared before neoForge because the mods block below joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless test runner. NeoForge's patched server Main boots a
        // GameTestServer that runs every registered @GameTest and exits - no
        // window, no live instance. This is the only verification gate.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }
    }

    // Contract unit tests (resource pairs, leak/contract fixtures) need MC/DFU/
    // log4j classes on the test classpath; the template's own tests avoided MC
    // so it never wired this (same line as core - it resolves against this
    // extension, not the project).
    addModdingDependenciesTo sourceSets.test

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // The gametest source set joins the mod for the dev runs so
            // @GameTestHolder is discovered from FML's scan data. It is still
            // not in the jar - the jar only packages sourceSets.main.
            sourceSet sourceSets.gametest
        }
    }
}

// Expand the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml at build time, so mod identity is edited in one place
// (gradle.properties) rather than duplicated in the toml.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Feed the generated metadata in as a resource dir; passing the task provider
// wires the dependency so the toml is generated before resources are processed.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// JUnit suite: the CI junit check grades it and refuses to pass on an empty
// run, so this configuration must stay wired in every derived repo.
repositories {
    mavenLocal()
    maven {
        name = 'AbilityCorePackages'
        url = uri('https://maven.pkg.github.com/HexaHexes/ability-core')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    maven {
        // Soft hook (REPO.md: ability_hotbar optional): the unlock gate's
        // assignment hygiene reads/writes the hotbar's public bar-state.
        name = 'AbilityHotbarPackages'
        url = uri('https://maven.pkg.github.com/HexaHexes/ability-hotbar')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    mavenCentral()
    maven {
        // Tensura: Reincarnated (ARR) is never redistributed from here - CurseMaven
        // serves the vendor's own CurseForge file (AGENTS: compile-only mods use
        // CurseMaven coordinates).
        name = 'CurseMaven'
        url = uri('https://cursemaven.com')
        content {
            includeGroup 'curse.maven'
        }
    }
}

// ManasCore ships as a monolith whose API lives in nested jars (JarJar):
// the compile classpath needs the nested skill module (SkillAPI), while the
// runs get the outer jar and FML unpacks the nested mods itself. Extracted
// at build time - never vendored into the repo (DEC-06: GPLv3 components are
// referenced, not redistributed).
configurations {
    manascoreApi
}

def extractManascoreApi = tasks.register('extractManascoreApi', Copy) {
    from({ zipTree(configurations.manascoreApi.singleFile) })
    // Every nested module: SkillAPI's signatures reach across them (Storage
    // lives in manascore-storage, the registrar glue in manascore-architectury).
    include 'META-INF/jars/*.jar'
    into layout.buildDirectory.dir('manascore-api')
}

dependencies {
    // Shared ability contracts from the core repo (GitHub Packages). compileOnly
    // for main - NeoForge resolves the mod at runtime as a separate mod, never
    // bundled - and on the test runtime classpath for the contract test below.
    // Deliberate bump (docs/release-plan.md): the resource pairs need core's
    // provider/consumer surface and the mod-gated declare overloads (#88/#92).
    def abilityCore = 'org.bitwisemadness.abilitycore:ability_core:1.0.0-alpha.45'
    compileOnly abilityCore
    testImplementation abilityCore
    // Core is a runtime mod for every dev run and the GameTest server: the
    // battlewill catalog registers on core's registry at boot (#10), so the
    // gametest runtime must actually load ability_core - compileOnly alone
    // left it off every runtime classpath (the pair gates masked that while
    // Tensura's absence skipped the only core-touching code).
    runtimeOnly abilityCore

    // Tensura: Reincarnated API for the resource pairs (issue #41): compile-only,
    // never bundled; the pair gates on ModList("tensura") so an absent mod never
    // links these classes. CurseForge project 643695, file 8793360 =
    // tensura-neoforge-2.0.1.3.jar, the pack's shipped build (ids from the pack
    // manifest; a version-number Modrinth pin resolves the fabric artifact).
    def tensuraMod = 'curse.maven:tensura-reincarnated-643695:8793360'
    compileOnly tensuraMod
    testImplementation tensuraMod

    // GameTest/dev runtime closure for Tensura itself: the dynamic catalog
    // (#42) reads ARR's category tag files at RegisterEvent and the
    // coverage gametest proves every id registered, so the gametest runtime
    // must actually load ARR - plus its required closure (its
    // neoforge.mods.toml: manascore_* modules come nested inside ManasCore,
    // then architectury, geckolib, smartbrainlib, terrablender). File ids
    // from the pack manifest; runtimeOnly puts them on every run's
    // classpath without touching what main compiles against.
    def manascoreMod = 'curse.maven:manascore-619025:8022425'
    add('manascoreApi', manascoreMod) // nested skill module extracted for compilation (see extractManascoreApi)
    def manascoreApiFiles = fileTree(layout.buildDirectory.dir('manascore-api')) {
        include 'META-INF/jars/*.jar'
    }
    compileOnly manascoreApiFiles.builtBy(extractManascoreApi) // SkillAPI: the unlock gate's learned read
    testImplementation manascoreApiFiles.builtBy(extractManascoreApi)
    runtimeOnly tensuraMod
    runtimeOnly manascoreMod
    runtimeOnly "curse.maven:architectury-api-419699:8492726"
    runtimeOnly "curse.maven:geckolib-388172:8893490"
    runtimeOnly "curse.maven:smartbrainlib-661293:7055149"
    runtimeOnly "curse.maven:terrablender-940057:6054947"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Soft hook (REPO.md: ability_hotbar optional): the unlock gate's
    // assignment hygiene writes the hotbar's public bar-state and echoes
    // through its public sync. compileOnly + test classpath only - never on
    // a runtime: "optional" means absent must keep working (the gametest
    // boots without hotbar as the living proof, and every callsite sits
    // behind a ModList gate - the hotbar#120 linkage lesson).
    def abilityHotbar = 'org.bitwisemadness.abilityhotbar:ability_hotbar:1.0.0-alpha.55'
    compileOnly abilityHotbar
    testImplementation abilityHotbar
    // EventResult + Event for the ManasCore REMOVE_SKILL listener (the
    // architectury event API the skill events are typed against).
    compileOnly "curse.maven:architectury-api-419699:8492726"
}

test {
    useJUnitPlatform()
}

// --- GameTest harness -------------------------------------------------------

// Grade the run on the log summary, not the exit code: the GameTestServer prints
// "All N required tests passed :)" when every required test succeeds. Keep
// expectedTests in sync with the @GameTest methods in src/gametest.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def expectedTests = 2
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/ability-tensura')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (enforced) ----------------------------------------------
// The `static` CI job is the gate for all three. SpotBugs and Checkstyle ride
// Gradle's `check` graph too; Spotless stays out of it by design. Rationale and
// the shared-filter rules live in agents/AGENTS.md.
spotbugs {
    effort = com.github.spotbugs.snom.Effort.MAX
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

// Checkstyle 10.21.0 depends on guava 33.3.1-jre, which GHSA-xxph-c9ww-hj94
// (patched in 33.7.2) makes a deserialization DoS. Pin the patched version on
// the tool classpath so the dependency-review gate stays meaningful.
configurations.matching { it.name == 'checkstyle' }.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:33.7.2-jre'
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
